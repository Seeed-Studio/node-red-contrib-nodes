        <input type="text" id="node-input-client" />
    </div>
    <div class="form-row">
        <label for="node-input-protocol">
            <i class="fa fa-at"></i>
            Protocol
        </label>
        <select id="node-input-protocol" style="width: 70%;">
            <option value="0">RTSP</option>
        </select>
    </div>
    <div class="form-row">
        <label for="node-input-uri">
            <i class="fa fa-plug"></i>
            Port
        </label>
        <input type="number" id="node-input-port" min="1" max="65535" />
    </div>
    <div class="form-row">
        <label for="node-input-session">
            <i class="fa fa-comments"></i>
            Session
        </label>
        <input type="text" id="node-input-session" maxlength="8" />
    </div>
    <div class="form-row">
        <label for="node-input-username">
            <i class="fa fa-user"></i>
            Username
        </label>
        <input type="text" id="node-input-username" maxlength="32" />
    </div>
    <div class="form-row">
        <label for="node-input-password">
            <i class="fa fa-lock"></i>
            Password
        </label>
        <input type="password" id="node-input-password" maxlength="32" />
    </div>
    <div class="form-row">
        <label for="node-input-audio">
            <i class="fa fa-volume-up"></i>
            Audio
        </label>
        <input type="checkbox" id="node-input-audio" style="width: auto; margin-top: 0;" />
        <span style="margin-left: 8px;">Stream PCM audio (leave off for NVR/VMS compatibility)</span>
    </div>
    <div class="form-row">
        <label for="node-input-onvif">
            <i class="fa fa-sitemap"></i>
            ONVIF
        </label>
        <input type="checkbox" id="node-input-onvif" style="width: auto; margin-top: 0;" />
        <span style="margin-left: 8px;">Expose this stream via ONVIF (for NVR/VMS integration)</span>
    </div>

        <label for="node-input-onvif-port">

<script type="text/javascript">
    RED.nodes.registerType("stream", {
        category: "Vision AI",
        color: "#E28B8B",
        defaults: {
            name: { value: this.name || "stream" },
            protocol: { value: 0 },
            port: { value: 554, required: true },
            session: { value: "live", required: true },
            username: { value: "admin", required: false },
            password: { value: "admin", required: false },
            onvif: { value: false },
            onvif_port: { value: 8899, required: false },
            audio: { value: false },
            client: { type: "sscma", required: true, label: RED._("sscma") },
        },
        inputs: 1,
        outputs: 0,
        icon: "font-awesome/fa-video-camera",
        label: function () {
            return this.name || "stream";
        },
        oneditprepare: function () {
            var onvifCheckbox = $("#node-input-onvif");
            var onvifPortRow = $("#node-input-onvif-port-row");
            onvifCheckbox.prop("checked", this.onvif === true);
            onvifCheckbox.on("change", function () {
                onvifPortRow.toggle(onvifCheckbox.prop("checked"));
            });
            onvifPortRow.toggle(onvifCheckbox.prop("checked"));
        },
    });
</script>
<script type="text/markdown" data-help-name="stream">
This is the `Stream node` for Seeed SenseCraft Model Assistant such as reCamera or Pi camera.

### Input

Wire the camera node to the stream node to enable the streaming.

### Parameter

#### Configuration

Please also select sscma for the client.

#### ONVIF
Checkbox to expose this stream via ONVIF so that NVR/VMS platforms (e.g. Hikvision, Dahua) can discover the camera and pull the stream. When enabled, a SOAP service is started on the configured ONVIF port (default 8899) and the device answers WS-Discovery probes.

To add the camera on an NVR: choose the ONVIF protocol, enter the device IP with this ONVIF port, and use the stream username/password above.

#### Audio
Checkbox to include a PCM (L16/16kHz) audio track in the RTSP stream. Most NVR/VMS clients cannot play this format and some (e.g. Hikvision) refuse the whole stream when it is present, so keep it off for NVR integration and enable it only for clients known to support L16.

### Output

You can then use other applications such as VLC to view the RTSP stream out from reCamera. As an example in the above screenshot, you can use `rtsp://admin:admin@192.168.42.1:554/live` in VLC then you can see the H.264 streaming video.

#### Video Parameter

-   By default, the video parameters are set to 1920x1800 at 30fps.

#### Latency

The latency varies depending on the end applications you are using. For example, the latency with VLC is 500 ms.
</script>
